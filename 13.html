  <title>2025년 위험물산업기사실기 3회 기출복원 (통합본 20제)</title>
  <style>
    /* ================== 기본 공통 스타일 ================== */
    body { font-family: 'Malgun Gothic', sans-serif; margin: 30px; max-width: 900px; background-color: #f4f6f9; color: #333; }
    h1 { color: #2c3e50; text-align: center; margin-bottom: 5px; }
    .instruction { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-size: 0.95em; }
    
    .mode-selection { text-align: center; margin-bottom: 30px; }
    .mode-selection label {
      display: inline-block; margin: 0 10px; padding: 10px 20px;
      font-size: 1.05em; font-weight: bold; border-radius: 8px; cursor: pointer;
      border: 2px solid #ced4da; transition: all 0.2s; background-color: #fff; color: #666;
    }
    .mode-selection label.active { border-color: #1976d2; background-color: #e3f2fd; color: #1976d2; }

    .question-card { background-color: #fff; border-radius: 10px; padding: 25px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .main-q-title { font-weight: bold; font-size: 1.2em; margin-bottom: 15px; color: #1976d2; border-bottom: 2px solid #e3f2fd; padding-bottom: 10px; line-height: 1.4; }
    
    .sub-q-container { margin-top: 15px; padding-left: 10px; }
    .sub-q-label { font-weight: bold; margin-bottom: 8px; font-size: 1.05em; line-height: 1.4; }
    
    .input-standard, .input-calc { 
      width: 100%; padding: 12px; font-size: 15px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px; transition: border-color 0.2s;
    }
    .input-standard:focus, .input-calc:focus, .textarea-formula:focus { outline: none; border-color: #1976d2; box-shadow: 0 0 0 3px rgba(25,118,210,0.15); }
    
    .textarea-formula {
      width: 100%; padding: 12px; font-size: 15px; border: 1px dashed #adb5bd; border-radius: 6px; box-sizing: border-box; margin-bottom: 5px; resize: vertical; min-height: 80px; background-color: #f8f9fa; line-height: 1.4;
    }
    .calc-label { font-size: 0.85em; color: #6c757d; font-weight: bold; margin-bottom: 3px; display: block; }
    
    .feedback-box { margin-top: 5px; padding: 15px; border-radius: 6px; font-weight: bold; font-size: 0.95em; display: none; line-height: 1.5; }
    .is-correct { background-color: #e8f5e9; border: 1px solid #c8e6c9; color: #2e7d32; }
    .is-incorrect { background-color: #ffebee; border: 1px solid #ffcdd2; color: #c62828; }
    .is-partial { background-color: #fff3e0; border: 1px solid #ffe0b2; color: #e65100; }
    
    .override-btns { margin-top: 15px; padding-top: 10px; border-top: 1px dashed #ccc; }
    .btn-override { padding: 6px 12px; font-size: 0.85em; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; color: #fff; transition: opacity 0.2s; }
    .btn-override:hover { opacity: 0.8; }
    .btn-correct { background-color: #4caf50; }
    .btn-partial { background-color: #ff9800; }
    .btn-incorrect { background-color: #f44336; }
    
    .btn-grade-single { margin-top: 15px; padding: 10px 20px; font-size: 0.95em; background-color: #607d8b; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; float: right; transition: background-color 0.2s; }
    .btn-grade-single:hover { background-color: #455a64; }
    .clearfix::after { content: ""; clear: both; display: table; }

    .submit-section { text-align: center; margin-top: 40px; margin-bottom: 50px; }
    .btn-submit { padding: 15px 40px; font-size: 1.2em; background-color: #1976d2; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(25,118,210,0.3); }
    .btn-submit:hover { background-color: #1565c0; }
    .btn-submit:disabled { background-color: #9e9e9e; cursor: not-allowed; box-shadow: none; }
    
    #final-result { margin-top: 25px; font-size: 1.4em; font-weight: bold; padding: 20px; background-color: #fff; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; display: none; line-height: 1.5; }
    .q-score-badge { float: right; font-size: 0.8em; background-color: #e3f2fd; color: #1976d2; padding: 4px 10px; border-radius: 20px; margin-left: 10px; }

    /* ================== 우측 문항 내비게이션 패널 스타일 ================== */
    #q-nav-panel {
      position: fixed; top: 50px; right: 20px; width: 170px; background-color: #fff;
      border: 2px solid #ced4da; border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      z-index: 999; display: flex; flex-direction: column; max-height: calc(100vh - 120px);
    }
    .q-nav-header { background-color: #f8f9fa; padding: 12px; text-align: center; font-weight: bold; font-size: 0.95em; border-bottom: 1px solid #ced4da; border-top-left-radius: 8px; border-top-right-radius: 8px; color: #1976d2; }
    .q-nav-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 12px; overflow-y: auto; }
    .q-nav-btn { padding: 8px 0; font-size: 0.9em; font-weight: bold; border: 1px solid #dee2e6; border-radius: 6px; background-color: #fff; color: #6c757d; cursor: pointer; transition: all 0.2s; }
    .q-nav-btn:hover { background-color: #e9ecef; color: #495057; }
    .q-nav-btn.answered { background-color: #e3f2fd; border-color: #90caf9; color: #1976d2; } 
    .q-nav-btn.correct { background-color: #e8f5e9; border-color: #81c784; color: #2e7d32; }  
    .q-nav-btn.partial { background-color: #fff3e0; border-color: #ffb74d; color: #e65100; }  
    .q-nav-btn.incorrect { background-color: #ffebee; border-color: #e57373; color: #c62828; } 
    .q-nav-legend { font-size: 0.75em; padding: 10px; border-top: 1px solid #ced4da; background-color: #f8f9fa; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; color: #666; line-height: 1.6; }
    .q-nav-legend .box { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
    @media (max-width: 1150px) { #q-nav-panel { display: none; } }

    /* ================== 이미지 확대 모달 스타일 ================== */
    #image-modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); flex-direction: column; }
    #image-modal-content { position: relative; width: 100%; height: calc(100% - 60px); overflow: hidden; display: flex; justify-content: center; align-items: center; }
    #modal-img { position: absolute; max-width: 100%; max-height: 100%; cursor: grab; transform-origin: center center; transition: transform 0.05s linear; user-select: none; }
    #modal-img:active { cursor: grabbing; }
    .modal-zoom-controls { height: 60px; display: flex; justify-content: center; align-items: center; gap: 10px; background-color: rgba(34, 34, 34, 0.9); z-index: 10001; }
    .modal-zoom-controls button { padding: 10px 15px; font-size: 1em; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; background-color: #1976d2; color: white; transition: background-color 0.2s; }
    .modal-zoom-controls button:hover { background-color: #1565c0; }
    .modal-zoom-controls .modal-close-btn { background-color: #f44336; }
    .modal-zoom-controls .modal-close-btn:hover { background-color: #d32f2f; }

    /* ================== 플로팅 연습장 스타일 ================== */
    #sp-toggle-btn { position: fixed; bottom: 20px; right: 20px; z-index: 9999; background-color: #ff9800; color: white; border: none; border-radius: 50px; padding: 15px 20px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: background-color 0.2s; }
    #sp-toggle-btn:hover { background-color: #f57c00; }
    #sp-panel { position: fixed; bottom: 80px; right: 20px; z-index: 9998; width: 95vw; max-width: 720px; height: 630px; background-color: #fff; border: 2px solid #ccc; border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); display: none; flex-direction: column; overflow: hidden; }
    #sp-header { background-color: #f8f9fa; padding: 10px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
    .sp-title { font-weight: bold; color: #333; font-size: 14px; }
    .sp-tools button { background-color: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 6px 10px; cursor: pointer; font-size: 13px; margin-left: 4px; }
    .sp-tools button.active { background-color: #e3f2fd; border-color: #1976d2; font-weight: bold; color: #1976d2; }
    #sp-canvas { flex-grow: 1; cursor: crosshair; background-color: #fff; touch-action: none; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }
    
    /* 퀴즈 컨테이너 내의 모든 이미지에 대한 공통 스타일 (클릭 가능 여부 시각화) */
    .question-card img { 
      max-width: 100%; 
      border: 1px solid #ced4da; 
      border-radius: 5px; 
      cursor: zoom-in; 
      transition: opacity 0.2s, box-shadow 0.2s;
    }
    .question-card img:hover { 
      opacity: 0.85; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
<div style="margin-bottom:15px;"><a href="index.html#section3" style="display:inline-block;padding:8px 16px;background:#e0e0e0;color:#333;text-decoration:none;border-radius:8px;font-weight:bold;font-family:'Malgun Gothic',sans-serif;">◀ 메인 메뉴로</a></div>

  <h1>📝 2025년 위험물산업기사실기 3회 기출복원 (통합본 20제)</h1>
  <p class="instruction">개별 문제의 [해설 확인] 버튼을 누르거나, 맨 아래 [전체 제출]을 눌러 채점하세요.<br>※ 화학식 입력 시 대소문자를 정확하게 구분하여 입력해야 정답 처리됩니다.<br>서술형이나 그림 문제는 정답 확인 후 자율 채점(정답 인정/부분 점수)이 가능합니다.</p>
  
  <div class="mode-selection" id="mode-selection">
    <label class="active" id="label-basic" onclick="setMode('basic')">📝 시험 모드 (실전 테스트)</label>
    <label id="label-study" onclick="setMode('study')">📖 해설 모드 (해설 펼쳐보기)</label>
  </div>
  
  <!-- 문제 출력 영역 -->
  <div id="quiz-container"></div>

  <!-- 전체 제출 버튼 -->
  <div class="submit-section">
    <button id="submit-btn" class="btn-submit" onclick="gradeAll()">전체 제출 및 채점하기</button>
    <div id="final-result"></div>
  </div>

  <!-- ================== 우측 하단 플로팅 연습장 UI ================== -->
  <button id="sp-toggle-btn" onclick="toggleScratchpad()">📝 연습장</button>
  <div id="sp-panel">
    <div id="sp-header">
      <span class="sp-title">연습장 (구조식/계산식)</span>
      <div class="sp-tools">
        <button id="sp-pen" class="active" onclick="setSpTool('pen')">✏️ 펜</button>
        <button id="sp-eraser" onclick="setSpTool('eraser')">🧽 지우개</button>
        <button onclick="clearSpCanvas()">🗑️ 비우기</button>
      </div>
    </div>
    <canvas id="sp-canvas"></canvas>
  </div>

  <!-- ================== 이미지 확대 및 PAN(드래그) 모달 UI ================== -->
  <div id="image-modal">
    <div id="image-modal-content" onclick="if(event.target === this) closeImageModal()">
      <img id="modal-img" src="" alt="확대된 이미지" draggable="false">
    </div>
    <div class="modal-zoom-controls">
      <button onclick="zoomImage(0.25)">확대 ➕</button>
      <button onclick="zoomImage(-0.25)">축소 ➖</button>
      <button onclick="resetZoom()">원래 크기 🔄</button>
      <button class="modal-close-btn" onclick="closeImageModal()">닫기 ❌</button>
    </div>
  </div>

  <script>
    let gradingState = [];
    let isTestSubmitted = false;

    // 추출된 기출복원 문제 데이터 (1번 ~ 20번 모두 포함)
    const quizData = [
      {
        mainQuestion: "문제 1. 알루미늄에 대하여 다음 반응식을 각각 쓰시오.",
        score: 5,
        subs: [
          { label: "① 연소 반응식", type: "equation", answers: ["4Al + 3O2 -> 2Al2O3"] },
          { label: "② 물과의 반응식", type: "equation", answers: ["2Al + 6H2O -> 2Al(OH)3 + 3H2"] },
          { label: "③ 염산과의 반응식", type: "equation", answers: ["2Al + 6HCl -> 2AlCl3 + 3H2"] }
        ],
        explanation: "[해설]<br>알루미늄분은 <b>제2류 위험물(금속분)</b>으로, 산소와 결합하면 산화알루미늄이 되고 물·산과 반응하면 <b>수소</b>가 나온다.<br>연소하면 흰색 산화알루미늄(Al<sub>2</sub>O<sub>3</sub>)이 생긴다.<br>4Al + 3O<sub>2</sub> → 2Al<sub>2</sub>O<sub>3</sub><br>물과 반응하면 수산화알루미늄과 가연성 수소가 생긴다.<br>2Al + 6H<sub>2</sub>O → 2Al(OH)<sub>3</sub> + 3H<sub>2</sub>↑<br>염산과 반응하면 염화알루미늄과 수소가 생긴다.<br>2Al + 6HCl → 2AlCl<sub>3</sub> + 3H<sub>2</sub>↑<br>혼동 주의: 물에 닿으면 수소가 생기므로 주수소화는 금지하고 마른모래 등으로 질식소화한다."
      },
      {
        mainQuestion: "문제 2. 다음 위험물의 반응식을 각각 쓰시오.",
        score: 5,
        subs: [
          { label: "① 트라이메틸알루미늄과 물의 반응식", type: "equation", answers: ["(CH3)3Al + 3H2O -> Al(OH)3 + 3CH4"] },
          { label: "② 트라이메틸알루미늄의 완전연소 반응식", type: "equation", answers: ["2(CH3)3Al + 12O2 -> Al2O3 + 6CO2 + 9H2O"] },
          { label: "③ 트라이에틸알루미늄과 물의 반응식", type: "equation", answers: ["(C2H5)3Al + 3H2O -> Al(OH)3 + 3C2H6"] },
          { label: "④ 트라이에틸알루미늄의 완전연소 반응식", type: "equation", answers: ["2(C2H5)3Al + 21O2 -> Al2O3 + 12CO2 + 15H2O"] }
        ],
        explanation: "[해설]<br>알킬알루미늄은 <b>제3류(자연발화성·금수성)</b> 위험물이다. 물과 만나면 수산화알루미늄과 함께, 알킬기에서 나온 가연성 탄화수소 가스를 낸다.<br>트라이메틸알루미늄은 물과 반응하면 메틸기가 <b>메탄</b>이 되고, 완전연소하면 산화알루미늄·이산화탄소·수증기가 된다.<br>(CH<sub>3</sub>)<sub>3</sub>Al + 3H<sub>2</sub>O → Al(OH)<sub>3</sub> + 3CH<sub>4</sub><br>2(CH<sub>3</sub>)<sub>3</sub>Al + 12O<sub>2</sub> → Al<sub>2</sub>O<sub>3</sub> + 6CO<sub>2</sub> + 9H<sub>2</sub>O<br>트라이에틸알루미늄은 물과 반응하면 에틸기가 <b>에탄</b>이 되고, 연소 생성물은 트라이메틸알루미늄과 같다.<br>(C<sub>2</sub>H<sub>5</sub>)<sub>3</sub>Al + 3H<sub>2</sub>O → Al(OH)<sub>3</sub> + 3C<sub>2</sub>H<sub>6</sub><br>2(C<sub>2</sub>H<sub>5</sub>)<sub>3</sub>Al + 21O<sub>2</sub> → Al<sub>2</sub>O<sub>3</sub> + 12CO<sub>2</sub> + 15H<sub>2</sub>O<br>계수 맞추는 요령: 먼저 2몰을 기준으로 Al<sub>2</sub>O<sub>3</sub> 1개를 맞춘다. 그다음 C 수만큼 CO<sub>2</sub>, H 수의 절반만큼 H<sub>2</sub>O를 쓰고, 생성물의 산소 원자 수를 합해 반으로 나누면 O<sub>2</sub> 계수가 된다."
      },
      {
        mainQuestion: "문제 3. 다음 [표]는 제2류 위험물 중 황화인에 관한 것이다. 빈칸 ( ① )~( ⑤ )에 알맞은 답을 쓰시오.<br><table style='width:100%; border-collapse: collapse; margin-top: 15px; text-align: center; font-size: 0.9em; background-color: #fff;'><tr style='background-color: #f8f9fa;'><th style='border: 1px solid #ccc; padding: 10px;'>명칭</th><th style='border: 1px solid #ccc; padding: 10px;'>화학식</th><th style='border: 1px solid #ccc; padding: 10px;'>조해성 유무</th></tr><tr><td style='border: 1px solid #ccc; padding: 10px;'>( ① )</td><td style='border: 1px solid #ccc; padding: 10px;'>P<sub>4</sub>S<sub>3</sub></td><td style='border: 1px solid #ccc; padding: 10px;'>( ② )</td></tr><tr><td style='border: 1px solid #ccc; padding: 10px;'>오황화인</td><td style='border: 1px solid #ccc; padding: 10px;'>( ③ )</td><td style='border: 1px solid #ccc; padding: 10px;'>( ④ )</td></tr><tr><td style='border: 1px solid #ccc; padding: 10px;'>칠황화인</td><td style='border: 1px solid #ccc; padding: 10px;'>( ⑤ )</td><td style='border: 1px solid #ccc; padding: 10px;'>조해성</td></tr></table>",
        score: 5,
        subs: [
          { label: "①", type: "short", answers: ["삼황화인"] },
          { label: "②", type: "short", answers: ["비조해성", "비조해성(없음)", "없음", "비조해성(무)"] },
          { label: "③", type: "formula", answers: ["P2S5"] },
          { label: "④", type: "short", answers: ["조해성", "조해성(있음)", "있음", "조해성(유)"] },
          { label: "⑤", type: "formula", answers: ["P4S7"] }
        ],
        explanation: "[해설]<br>제2류 위험물 <b>황화인</b>은 인(P)과 황(S)의 조성비에 따라 삼황화인·오황화인·칠황화인으로 나뉜다.<br><ul><li>삼황화인 — P<sub>4</sub>S<sub>3</sub>이며, 습기를 빨아들이지 않는 <b>비조해성</b>이다.</li><li>오황화인 — P<sub>2</sub>S<sub>5</sub>이며, 습기를 흡수해 녹는 <b>조해성</b>이다.</li><li>칠황화인 — P<sub>4</sub>S<sub>7</sub>이며, 조해성이다.</li></ul>외우는 요령: 이름의 숫자는 황(S) 원자 수이고, 조해성이 없는 것은 삼황화인 하나뿐이다."
      },
      {
        mainQuestion: "문제 4. TNT에 대하여 다음 물음에 답하시오. (단, TNT는 1종이다.)",
        score: 5,
        subs: [
          { label: "① 시성식을 쓰시오.", type: "formula", answers: ["C6H2CH3(NO2)3", "C6H2(CH3)(NO2)3"] },

        explanation: "[해설]<br><b>위험물안전관리법 시행규칙 별표 17</b>의 소화설비 적응성 표에 따른다.<br><ul><li>탄화칼슘 — 제3류 금수성물질이라 물과 반응하면 아세틸렌이 생기므로, 보기의 설비 모두 적응성이 없다.</li><li>과산화나트륨 — 제1류 알칼리금속의 과산화물이라 물과 반응하면 산소와 열이 나므로 적응성이 없다.</li><li>인화성고체 — 제2류이지만 금수성이 아니어서 물을 쓰는 설비와 불활성가스소화설비 모두 적응성이 있다.</li><li>철분 — 물과 반응하면 수소가 생기는 제2류 철분·금속분·마그네슘 등이라 적응성이 없다.</li><li>과산화수소 — 제6류로 물을 뿌려 끌 수 있어 옥내·옥외소화전설비와 스프링클러소화설비는 적응성이 있다.</li></ul>혼동 주의: 제6류는 산소를 차단해 끄는 방식이 효과가 없으므로 <b>불활성가스소화설비</b>는 적응성이 없다."
      }
    ];

    // ================== 메인 렌더링 및 채점 로직 ==================

      } else {

      }
    }

          } else {

        html += `  <button id="btn-grade-single-${qIndex}" class="btn-grade-single" style="float: none;" onclick="gradeSingleQuestion(${qIndex})">✔️ 정답 확인 및 채점</button>`;

    function setMode(mode) {
      const labelBasic = document.getElementById('label-basic');
      const labelStudy = document.getElementById('label-study');
      
      if (mode === 'study') {
        if(labelStudy.classList.contains('active')) return; 
        labelBasic.classList.remove('active');
        labelStudy.classList.add('active');
        
        quizData.forEach((q, qIndex) => {
          const expEl = document.getElementById(`exp-${qIndex}`);
          const toggleBtn = document.getElementById(`btn-toggle-exp-${qIndex}`);
          if (expEl) {
            expEl.style.display = 'block';

              toggleBtn.style.display = 'inline-block';
              toggleBtn.innerHTML = '📖 해설 닫기';
            }
          }
        });
      } else if (mode === 'basic') {
        if(confirm("기본 모드로 전환하면 현재 입력된 내용이 초기화됩니다. 전환하시겠습니까?")) {

        }
      }
    }

    // 반응식 파싱 전처리 함수 (앞에 명칭이 붙어있을 경우 무시하고 반응식만 추출)
    function isEquationCorrect(userInput, ansList) {
      let sanitizeEq = (str) => {
        let s = str.replace(/\s+/g, '').replace(/=/g, '->');
        let dashIdx = s.indexOf('-');
        let arrowIdx = s.indexOf('->');
        // '->' 앞쪽에 '-' 가 있다면 앞쪽 텍스트(알파벳/한글 명칭 등) 무시
        if (dashIdx !== -1 && arrowIdx !== -1 && dashIdx < arrowIdx) {
          s = s.substring(dashIdx + 1);
        }
        return s;
      };

      let u = sanitizeEq(userInput);
      let uParts = u.split('->');
      if(uParts.length !== 2) return false;
      let uLeft = uParts[0].split('+').sort().join('+');
      let uRight = uParts[1].split('+').sort().join('+');
      
      for(let i=0; i<ansList.length; i++) {
        let a = sanitizeEq(ansList[i]);
        let aParts = a.split('->');
        if(aParts.length !== 2) continue;
        let aLeft = aParts[0].split('+').sort().join('+');
        let aRight = aParts[1].split('+').sort().join('+');
        if (uLeft === aLeft && uRight === aRight) return true;
      }
      return false;
    }

    function evaluateSub(qIndex, sIndex) {
      const sub = quizData[qIndex].subs[sIndex];
      const inputEl = document.getElementById(`ans-${qIndex}-${sIndex}`);
      if (inputEl.disabled) return; 

      let userVal = inputEl.value;
      let isCorrect = false;

      if (userVal.trim() === "") {
         isCorrect = false;
      } else if (sub.type === 'short' || sub.type === 'calc') {
        let uClean = userVal.replace(/\s+/g, '').toLowerCase();
        isCorrect = sub.answers.some(a => a.replace(/\s+/g, '').toLowerCase() === uClean);
      } else if (sub.type === 'formula') {
        let uClean = userVal.replace(/\s+/g, '');
        isCorrect = sub.answers.some(a => a.replace(/\s+/g, '') === uClean);
      } else if (sub.type === 'order') {
        let uClean = userVal.replace(/[^0-9]/g, '');
        isCorrect = sub.answers.some(a => a.replace(/[^0-9]/g, '') === uClean);
      } else if (sub.type === 'unordered_comma') {
        let uClean = userVal.replace(/\s+/g, '').toLowerCase();
        isCorrect = sub.answers.some(a => {
            let aClean = a.replace(/\s+/g, '').toLowerCase();
            let uArr = uClean.split(',').filter(Boolean).sort();
            let aArr = aClean.split(',').filter(Boolean).sort();
            return uArr.length === aArr.length && uArr.every((val, index) => val === aArr[index]);
        });
      } else if (sub.type === 'equation') {
        isCorrect = isEquationCorrect(userVal, sub.answers);
      } else if (sub.type === 'descriptive') {
        if (sub.keywords) {
          let hasAllKeys = sub.keywords.every(kw => userVal.includes(kw));
          isCorrect = hasAllKeys;
        } else {
          isCorrect = false; 
        }
      }

      gradingState[qIndex].subs[sIndex].status = isCorrect ? 1 : 0;
      inputEl.disabled = true;
      const calcEl = document.getElementById(`calc-${qIndex}-${sIndex}`);
      if (calcEl) calcEl.disabled = true;

      updateFeedbackUI(qIndex, sIndex);
    }

    function updateFeedbackUI(qIndex, sIndex) {
      const q = quizData[qIndex];
      const sub = q.subs[sIndex];
      const state = gradingState[qIndex].subs[sIndex];
      const fbDiv = document.getElementById(`fb-${qIndex}-${sIndex}`);
      
      let html = "";
      if (sub.isExcluded) {
        fbDiv.className = "feedback-box";
        fbDiv.style.backgroundColor = "#f1f5f9";
        fbDiv.style.border = "1px solid #cbd5e1";
        fbDiv.style.color = "#64748b";
        html += `➖ 채점 제외 항목입니다.`;
      } else if (state.status === 1) {
        fbDiv.className = "feedback-box is-correct";
        html += `✅ 정답입니다!`;
      } else if (state.status === 0.5) {
        fbDiv.className = "feedback-box is-partial";
        html += `⚠ 부분 점수 (0.5개 인정)`;
      } else {
        fbDiv.className = "feedback-box is-incorrect";
        if (q.isUnordered) {
          html += `❌ 오답입니다. (모범 답안 중 하나: ${sub.answers[0]})`;
        } else if (q.isUnordered || sub.type === 'unordered_comma') {
          html += `❌ 오답입니다. (모범 답안: ${sub.answers[0]})`;
        } else {
          html += `❌ 오답입니다. (모범 답안: ${sub.answers[0]})`;
        }
      }

      if (sub.answerImage) {
        html += `<div style="margin-top: 15px; text-align: center;">
                   <img src="${sub.answerImage}" style="max-width: 100%; border: 2px solid #2196f3; border-radius: 5px; cursor: zoom-in;" alt="정답 해설 이미지" onclick="openImageModal(this.src)" title="클릭하여 확대">
                   <div style="font-size:0.85em; color:#1976d2; margin-top:5px;">[정답 참고 이미지 - 클릭 시 확대]</div>
                 </div>`;
      }

      if (sub.type === 'descriptive') {
        html += `<div class="override-btns">
                  <span style="font-size:0.85em; color:#666; font-weight:normal; margin-right:8px;">▶ 서술/그림 자율 채점:</span><br><br>
                  <button class="btn-override btn-correct" onclick="overrideScore(${qIndex}, ${sIndex}, 1)">정답 인정</button>
                  <button class="btn-override btn-partial" onclick="overrideScore(${qIndex}, ${sIndex}, 0.5)">부분 점수</button>
                  <button class="btn-override btn-incorrect" onclick="overrideScore(${qIndex}, ${sIndex}, 0)">오답 처리</button>
                 </div>`;
      }

      fbDiv.innerHTML = html;
      fbDiv.style.display = "block";
    }

    function updateCardScore(qIndex) {
      const q = quizData[qIndex];
      let correctSubs = 0;
      let gradableCount = 0;
      
      q.subs.forEach((sub, sIndex) => {
        if (!sub.isExcluded) {
          correctSubs += gradingState[qIndex].subs[sIndex].status;
          gradableCount++;
        }
      });
      
      // 채점 제외 대상을 빼고 유효한 문항 수로 배점 계산
      gradingState[qIndex].earnedScore = gradableCount > 0 ? (correctSubs / gradableCount) * q.score : 0;
      
      const cardTitle = document.querySelector(`#qCard-${qIndex} .q-score-badge`);
      if(cardTitle) {
        let qEarnedScore = Math.round(gradingState[qIndex].earnedScore * 10) / 10;
        cardTitle.innerHTML = `배점: ${q.score}점 (획득: <strong>${qEarnedScore}점</strong>)`;
        if (qEarnedScore === q.score) cardTitle.style.backgroundColor = "#e8f5e9";
        else if (qEarnedScore > 0) cardTitle.style.backgroundColor = "#fff3e0";
        else cardTitle.style.backgroundColor = "#ffebee";
      }
    }

    function gradeSingleQuestion(qIndex) {
      const q = quizData[qIndex];

      if (q.isUnordered) {
        let answerPool = [];
        q.subs.forEach(sub => {
          if (!sub.isExcluded) {
            answerPool.push(sub.answers);
          }
        });

        q.subs.forEach((sub, sIndex) => {
          const inputEl = document.getElementById(`ans-${qIndex}-${sIndex}`);
          if (!inputEl || inputEl.disabled) return;

          let userVal = inputEl.value;
          let isCorrect = false;

          if (sub.isExcluded) {
            gradingState[qIndex].subs[sIndex].status = 0;
            inputEl.disabled = true;
            updateFeedbackUI(qIndex, sIndex);
            return;
          }

          if (userVal.trim() !== "") {
            for (let i = 0; i < answerPool.length; i++) {
              let possibleAnswers = answerPool[i];
              
              if (sub.type === 'equation') {
                if (isEquationCorrect(userVal, possibleAnswers)) {
                  isCorrect = true;
                  answerPool.splice(i, 1);
                  break;
                }
              } else {
                let uClean = sub.type === 'formula' ? userVal.replace(/\s+/g, '') : userVal.replace(/\s+/g, '').toLowerCase();
                let matched = possibleAnswers.some(a => {
                  let aClean = sub.type === 'formula' ? a.replace(/\s+/g, '') : a.replace(/\s+/g, '').toLowerCase();
                  return aClean === uClean;
                });
                if(matched) {
                  isCorrect = true;
                  answerPool.splice(i, 1);
                  break;
                }
              }
            }
          }

          gradingState[qIndex].subs[sIndex].status = isCorrect ? 1 : 0;
          inputEl.disabled = true;
          updateFeedbackUI(qIndex, sIndex);
        });
      } else {
        const poolUsed = {};
        const normPool = v => v.replace(/\s+/g, '').toLowerCase();
        q.subs.forEach((sub, sIndex) => {
          if (sub.type === 'pool') {
            const inputEl = document.getElementById(`ans-${qIndex}-${sIndex}`);
            if (!inputEl || inputEl.disabled) return;
            const u = normPool(inputEl.value);
            const used = poolUsed[sub.poolId] = poolUsed[sub.poolId] || [];
            let ok = false;
            if (u !== '' && sub.answers.some(a => normPool(a) === u) && !used.includes(u)) { ok = true; used.push(u); }
            gradingState[qIndex].subs[sIndex].status = ok ? 1 : 0;
            inputEl.disabled = true;
            updateFeedbackUI(qIndex, sIndex);
          } else {
            evaluateSub(qIndex, sIndex);
          }
        });
      }

      updateCardScore(qIndex);
      gradingState[qIndex].isGraded = true;

      const expEl = document.getElementById(`exp-${qIndex}`);
      const toggleBtn = document.getElementById(`btn-toggle-exp-${qIndex}`);
      if (expEl) {
          expEl.style.display = 'block';
          if(toggleBtn) {
            toggleBtn.style.display = 'inline-block';
            toggleBtn.innerHTML = '📖 해설 닫기';
          }
      }
      
      const btnEl = document.getElementById(`btn-grade-single-${qIndex}`);
      if (btnEl) btnEl.style.display = 'none';
      if (isTestSubmitted) calculateFinalTotal();
    }

    function gradeAll() {
      isTestSubmitted = true;
      quizData.forEach((q, qIndex) => {
        if (!gradingState[qIndex].isGraded) {
          gradeSingleQuestion(qIndex);
        }
      });
      document.getElementById('submit-btn').style.display = 'none';
      calculateFinalTotal();
    }

    function overrideScore(qIndex, sIndex, newStatus) {
      gradingState[qIndex].subs[sIndex].status = newStatus;
      updateFeedbackUI(qIndex, sIndex);
      updateCardScore(qIndex);
      if (isTestSubmitted) calculateFinalTotal(); 
    }

    function calculateFinalTotal() {
      let totalEarned = 0;
      let totalMax = 0;

      quizData.forEach((q, qIndex) => {
        totalMax += q.score;
        totalEarned += gradingState[qIndex].earnedScore;
      });

      const resDiv = document.getElementById('final-result');
      resDiv.style.display = "block";
      
      totalEarned = Math.round(totalEarned * 10) / 10;
      let percent = Math.round((totalEarned / totalMax) * 100);
      let passMsg = percent >= 60 
        ? `<div style="color:#2e7d32; margin-top:10px;">🎉 합격을 축하합니다! 완벽에 가까워지고 있습니다.</div>`
        : `<div style="color:#c62828; margin-top:10px;">😢 불합격입니다. 부족한 부분의 해설을 꼭 복습하세요!</div>`;

      resDiv.innerHTML = `총 획득 점수: <strong>${totalEarned}점</strong> / ${totalMax}점 만점 <br> ${passMsg}`;
    }

    // ================== 우측 문항 내비게이션 ==================
    function initNavPanel() {
      const navHtml = `
        <div id="q-nav-panel">
          <div class="q-nav-header">📌 문항 이동</div>
          <div class="q-nav-grid" id="q-nav-grid"></div>
          <div class="q-nav-legend">
            <div><span class="box" style="background:#fff; border:1px solid #dee2e6;"></span>미작성</div>
            <div><span class="box" style="background:#e3f2fd; border:1px solid #90caf9;"></span>답안 입력됨</div>
            <div><span class="box" style="background:#e8f5e9; border:1px solid #81c784;"></span>정답 / 채점완료</div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', navHtml);

      const navGrid = document.getElementById('q-nav-grid');
      let gridHtml = '';
      quizData.forEach((q, qIndex) => {
        let displayNum = qIndex + 1;
        gridHtml += `<button class="q-nav-btn" id="nav-btn-${qIndex}" onclick="scrollToQuestion(${qIndex})">${displayNum}</button>`;
      });
      navGrid.innerHTML = gridHtml;

      document.getElementById('quiz-container').addEventListener('input', updateNavStatus);

      if (typeof gradeSingleQuestion === 'function') {
        const originalGradeSingle = gradeSingleQuestion;
        gradeSingleQuestion = function(qIndex) {
          originalGradeSingle(qIndex);
          updateNavStatus();
        };
      }

      if (typeof overrideScore === 'function') {
        const originalOverrideScore = overrideScore;
        overrideScore = function(qIndex, sIndex, newStatus) {
          originalOverrideScore(qIndex, sIndex, newStatus);
          updateNavStatus();
        };
      }

      if (typeof gradeAll === 'function') {
        const originalGradeAll = gradeAll;
        gradeAll = function() {
          originalGradeAll();
          updateNavStatus();
        };
      }
      updateNavStatus();
    }

    function scrollToQuestion(qIndex) {
      const target = document.getElementById(`qCard-${qIndex}`);
      if(target) {
        const topPos = target.getBoundingClientRect().top + window.pageYOffset - 20;
        window.scrollTo({ top: topPos, behavior: 'smooth' });
      }
    }

    function updateNavStatus() {
      quizData.forEach((q, qIndex) => {
        const navBtn = document.getElementById(`nav-btn-${qIndex}`);
        if(!navBtn) return;

        if (gradingState[qIndex] && gradingState[qIndex].isGraded) {
          let qEarnedScore = Math.round(gradingState[qIndex].earnedScore * 10) / 10;
          navBtn.className = 'q-nav-btn'; 
          if (qEarnedScore === q.score) navBtn.classList.add('correct');
          else if (qEarnedScore > 0) navBtn.classList.add('partial');
          else navBtn.classList.add('incorrect');
          return;
        }

        let hasAnswer = false;
        q.subs.forEach((sub, sIndex) => {
          const inputEl = document.getElementById(`ans-${qIndex}-${sIndex}`);
          const calcEl = document.getElementById(`calc-${qIndex}-${sIndex}`);
          if (inputEl && inputEl.value.trim() !== '') hasAnswer = true;
          if (calcEl && calcEl.value.trim() !== '') hasAnswer = true;
        });

        if (hasAnswer) {
          navBtn.classList.add('answered'); 
        } else {
          navBtn.classList.remove('answered'); 
        }
      });
    }

    // ================== 이미지 확대 및 PAN(드래그) 모달 스크립트 ==================
    let currentZoom = 1;
    let isDragging = false;
    let startX = 0, startY = 0;
    let translateX = 0, translateY = 0;

    function openImageModal(src) {
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-img');
      modalImg.src = src;
      currentZoom = 1;
      translateX = 0;
      translateY = 0;
      updateImageTransform();
      modal.style.display = 'flex';
    }

    function closeImageModal() {
      const modal = document.getElementById('image-modal');
      modal.style.display = 'none';
    }

    function zoomImage(step) {
      currentZoom += step;
      if (currentZoom < 0.5) currentZoom = 0.5;
      if (currentZoom > 5) currentZoom = 5; 
      updateImageTransform();
    }

    function resetZoom() {
      currentZoom = 1;
      translateX = 0;
      translateY = 0;
      updateImageTransform();
    }

    function updateImageTransform() {
      const modalImg = document.getElementById('modal-img');
      modalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentZoom})`;
    }

    const modalImg = document.getElementById('modal-img');
    modalImg.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
      modalImg.style.cursor = 'grabbing';
      modalImg.style.transition = 'none'; 
    });
    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateImageTransform();
    });
    document.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        modalImg.style.cursor = 'grab';
        modalImg.style.transition = 'transform 0.05s linear'; 
      }
    });

    modalImg.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - translateX;
        startY = e.touches[0].clientY - translateY;
        modalImg.style.transition = 'none';
      }
    }, { passive: false });
    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      e.preventDefault(); 
      translateX = e.touches[0].clientX - startX;
      translateY = e.touches[0].clientY - startY;
      updateImageTransform();
    }, { passive: false });
    document.addEventListener('touchend', () => {
      if (isDragging) {
        isDragging = false;
        modalImg.style.transition = 'transform 0.05s linear';
      }
    });
    modalImg.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY < 0) zoomImage(0.1);
      else zoomImage(-0.1);
    }, { passive: false });

    // ================== 플로팅 연습장 스크립트 ==================
    let spCanvas, spCtx;
    let spIsDrawing = false;
    let spCurrentTool = 'pen';

    function toggleScratchpad() {
      const panel = document.getElementById('sp-panel');
      const btn = document.getElementById('sp-toggle-btn');
      if (panel.style.display === 'flex') {
        panel.style.display = 'none';
        btn.innerText = "📝 연습장";
        btn.style.backgroundColor = "#ff9800";
      } else {
        panel.style.display = 'flex';
        btn.innerText = "❌ 닫기";
        btn.style.backgroundColor = "#757575";
        if (!spCanvas) initScratchpad();
      }
    }

    function initScratchpad() {
      spCanvas = document.getElementById('sp-canvas');
      spCtx = spCanvas.getContext('2d');
      function resizeCanvas() {
        const rect = spCanvas.parentElement.getBoundingClientRect();
        const headerHeight = document.getElementById('sp-header').offsetHeight;
        spCanvas.width = rect.width;
        spCanvas.height = rect.height - headerHeight;
      }
      resizeCanvas();
      
      spCanvas.addEventListener('mousedown', startSpDraw);
      spCanvas.addEventListener('mousemove', drawSp);
      spCanvas.addEventListener('mouseup', stopSpDraw);
      spCanvas.addEventListener('mouseout', stopSpDraw);
      spCanvas.addEventListener('touchstart', startSpDraw, { passive: false });
      spCanvas.addEventListener('touchmove', drawSp, { passive: false });
      spCanvas.addEventListener('touchend', stopSpDraw);
    }

    function getSpCoordinates(e) {
      const rect = spCanvas.getBoundingClientRect();
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
      }
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function startSpDraw(e) {
      e.preventDefault(); 
      spIsDrawing = true;
      const pos = getSpCoordinates(e);
      spCtx.beginPath();
      spCtx.moveTo(pos.x, pos.y);
    }

    function drawSp(e) {
      if (!spIsDrawing) return;
      e.preventDefault(); 
      const pos = getSpCoordinates(e);
      spCtx.lineTo(pos.x, pos.y);
      if (spCurrentTool === 'eraser') {
        spCtx.strokeStyle = '#fff'; 
        spCtx.lineWidth = 20;       
      } else {
        spCtx.strokeStyle = '#333'; 
        spCtx.lineWidth = 2;        
      }
      spCtx.lineCap = 'round';
      spCtx.lineJoin = 'round';
      spCtx.stroke();
    }

    function stopSpDraw() {
      spIsDrawing = false;
      spCtx.closePath();
    }

    function setSpTool(tool) {
      spCurrentTool = tool;
      document.getElementById('sp-pen').classList.remove('active');
      document.getElementById('sp-eraser').classList.remove('active');
      document.getElementById('sp-' + tool).classList.add('active');
    }

    function clearSpCanvas() {
      spCtx.clearRect(0, 0, spCanvas.width, spCanvas.height);
    }

    // 초기 실행
    renderQuiz();
    setTimeout(initNavPanel, 100);
  </script>
</body>
