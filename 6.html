<body>
  <div style="margin-bottom:15px;"><a href="index.html#section0" style="display:inline-block;padding:8px 16px;background:#e0e0e0;color:#333;text-decoration:none;border-radius:8px;font-weight:bold;font-family:'Malgun Gothic',sans-serif;">◀ 메인 메뉴로</a></div>
<div style="margin-bottom:15px;"><a href="index.html#section3" style="display:inline-block;padding:8px 16px;background:#e0e0e0;color:#333;text-decoration:none;border-radius:8px;font-weight:bold;font-family:'Malgun Gothic',sans-serif;">◀ 뒤로가기</a></div>

  <h1>📝 위험물산업기사 실기(필답형) 2023년 2회</h1>
  <p class="instruction">개별 문제의 [해설 확인] 버튼을 누르거나, 맨 아래 [전체 제출]을 눌러 채점하세요.<br>※ 화학식 입력 시 대소문자를 정확하게 구분하여 입력해야 정답 처리됩니다.<br>서술형이나 그림 문제는 정답 확인 후 자율 채점(정답 인정/부분 점수)이 가능합니다.</p>
  
  <div class="mode-selection" id="mode-selection">
    <label class="active" id="label-basic" onclick="setMode('basic')">
      📝 시험 모드 (실전 테스트)
    </label>
    <label id="label-study" onclick="setMode('study')">
      📖 해설 모드 (해설 펼쳐보기)
    </label>
  </div>

  <div id="quiz-container"></div>

  <div class="submit-section">
    <button id="submit-btn" class="btn-submit" onclick="gradeAll()">전체 제출 및 채점하기</button>
    <div id="final-result"></div>
  </div>
  
    <!-- ================== 전체화면 필기 모드 (MEMO) UI ================== -->
  <canvas id="overlay-canvas"></canvas>
  <div id="memo-wrapper">
    <div id="memo-header">
      <span>🖍 MEMO</span>
      <button id="memo-toggle-btn" onclick="toggleMemoMode()">필기 켜기</button>
    </div>
    <div id="memo-tools-panel">
      <!-- 도구 선택 -->
      <div class="memo-tool-row">
        <span class="memo-tool-label">도구:</span>
        <button id="memo-pen" class="memo-btn active" onclick="setMemoTool('pen')">✏️ 펜</button>
        <button id="memo-eraser" class="memo-btn" onclick="setMemoTool('eraser')">🧽 지우개</button>
      </div>
      
      <!-- 색상 선택 -->
      <div class="memo-tool-row" id="memo-color-row">
        <span class="memo-tool-label">색상:</span>
        <button class="color-btn color-red active" onclick="setMemoColor('#f44336', this)" title="빨강"></button>
        <button class="color-btn color-black" onclick="setMemoColor('#333333', this)" title="검정"></button>
        <button class="color-btn color-blue" onclick="setMemoColor('#2196f3', this)" title="파랑"></button>
        <button class="color-btn color-yellow" onclick="setMemoColor('#ffeb3b', this)" title="노랑"></button>
      </div>
      
      <!-- 굵기 조절 -->
      <div class="memo-tool-row">
        <span class="memo-tool-label">굵기:</span>
        <input type="range" id="memo-width-slider" class="memo-slider" min="1" max="50" value="3" onchange="updateMemoWidth(this.value)">
      </div>
      
      <!-- 기능 버튼 -->
      <div class="memo-tool-row" style="justify-content: flex-end; margin-top: 5px; border-top: 1px dashed #ccc; padding-top: 10px;">
        <button class="memo-btn" onclick="clearMemoCanvas()">🗑️ 화면 지우기</button>
      </div>
    </div>
  </div>

  <script>
    let gradingState = [];
    let isTestSubmitted = false;

    // 2023년 2회 문제 데이터
    const quizData = [
      {
        mainQuestion: "문제 1. 트리에틸알루미늄에 관하여 다음을 구하시오.",
        score: 5,
        subs: [
          { label: "① 물과의 반응식", type: "equation", answers: ["(C2H5)3Al + 3H2O -> Al(OH)3 + 3C2H6"] },
          { label: "② 1몰이 물과 반응할 때 발생하는 에탄의 부피(L)", type: "calc", answers: ["67.2", "67.2L"] },
          { label: "③ 옥내저장소에 저장할 때의 바닥면적(m²)", type: "short", answers: ["1000", "1,000", "1000m2", "1,000m2", "1000m²", "1,000m²"] }
        ],
        explanation: "[해설]<br>트리에틸알루미늄은 제3류 <b>알킬알루미늄</b>으로, 물과 격렬히 반응해 가연성 기체인 에탄을 낸다.<br>(C<sub>2</sub>H<sub>5</sub>)<sub>3</sub>Al + 3H<sub>2</sub>O → Al(OH)<sub>3</sub> + 3C<sub>2</sub>H<sub>6</sub><br>1몰이 반응하면 에탄 3몰이 생기고, 표준상태 기체 1몰은 22.4L다.<br>에탄 부피 = 3 × 22.4L = <b>67.2L</b><br>알킬알루미늄은 위험등급 I 위험물이어서 옥내저장소 저장창고 바닥면적이 <b>1,000m²</b> 이하로 제한된다."
      },
      {
        mainQuestion: "문제 2. 톨루엔 1000L, 스틸렌 1000L, 아닐린 4000L, 실린더유 6000L, 올리브유 20000L를 저장할 때, 지정수량 배수의 총합을 구하시오.",
        score: 5,
        subs: [
          { label: "계산과정 및 지정수량 배수 총합", type: "calc", answers: ["11", "11배"] }
        ],
        explanation: "[해설]<br><b>위험물안전관리법 시행령 별표 1</b>에 따라, 저장량을 품명별 지정수량으로 나눈 값을 모두 더하면 지정수량 배수의 총합이 된다.<br>품명별 지정수량은 다음과 같다. 톨루엔은 제1석유류 비수용성 200L, 스틸렌은 제2석유류 비수용성 1,000L, 아닐린은 제3석유류 비수용성 2,000L, 실린더유는 제4석유류 6,000L, 올리브유는 동식물유류 10,000L이다.<br>지정수량 배수 = Σ(저장량 ÷ 지정수량)<br>= 1000/200 + 1000/1000 + 4000/2000 + 6000/6000 + 20000/10000<br>= 5 + 1 + 2 + 1 + 2 = <b>11배</b><br>혼동 주의: 아닐린은 비수용성이라 지정수량이 <b>2,000L</b>이다. 수용성 제3석유류의 지정수량 4,000L와 헷갈리지 않도록 한다."

          { label: "② 품명 및 지정수량 (예: 00류, 00kg)", type: "short", answers: ["질산에스테르류, 10kg", "질산에스테르류, 10"] },
          { label: "③ 이산화탄소, 수증기, 질소, 산소가 발생하는 완전분해 반응식", type: "equation", answers: ["4C3H5(ONO2)3 -> 12CO2 + 10H2O + 6N2 + O2"] }
        ],
        explanation: "[해설]<br>규조토에 흡수시켜 다이너마이트를 만드는 제5류 위험물은 <b>니트로글리세린</b>이다. 글리세린의 -OH가 질산기(-ONO<sub>2</sub>)로 바뀐 질산에스테르다.<br>품명은 <b>질산에스테르류</b>이고, 현행 제5류 지정수량은 위험성 시험 결과에 따라 제1종 10kg, 제2종 100kg으로 나뉜다. 니트로글리세린은 제1종이라 <b>10kg</b>이다.<br>분자 안의 산소만으로 완전히 분해되어 이산화탄소·수증기·질소·산소를 만든다.<br>4C<sub>3</sub>H<sub>5</sub>(ONO<sub>2</sub>)<sub>3</sub> → 12CO<sub>2</sub> + 10H<sub>2</sub>O + 6N<sub>2</sub> + O<sub>2</sub><br>계수는 원료 4, 생성물 12·10·6·1 순서로 외운다. 양변의 C 12, H 20, N 12, O 36개가 맞는지 확인하면 된다."
      },
      {
        mainQuestion: "문제 20. 20℃ 물 10kg으로 주수소화할 때 100℃ 수증기로 흡수되는 열량(kcal)을 구하시오.",
        score: 5,
        subs: [
          { label: "계산과정 및 결과 (단위: kcal)", type: "calc", answers: ["6190", "6,190", "6190kcal", "6,190kcal"] }
        ],
        explanation: "[해설]<br>20℃ 물이 100℃ 수증기가 될 때 흡수하는 열량은 온도를 올리는 <b>현열</b>과 상태를 바꾸는 <b>증발잠열</b>(539kcal/kg)을 더한 값이다.<br>Q = m·c·Δt + m·γ<br>Q = 10 × 1 × (100 - 20) + 10 × 539<br>Q = 800 + 5,390 = <b>6,190kcal</b><br>혼동 주의: 현열만 계산해 800kcal로 쓰면 오답이다. 물이 냉각소화에 뛰어난 이유는 이 증발잠열이 크기 때문이다."
      }
    ];

// 특정 문제 해설 열기/닫기 토글 함수
function toggleExplanation(qIndex) {
      const expEl = document.getElementById(`exp-${qIndex}`);
      const toggleBtn = document.getElementById(`btn-toggle-exp-${qIndex}`);
      if (!expEl) return;
      
      if (expEl.style.display === 'none' || expEl.style.display === '') {
        expEl.style.display = 'block';
        if(toggleBtn) toggleBtn.innerHTML = '📖 해설 닫기';
      } else {
        expEl.style.display = 'none';
        if(toggleBtn) toggleBtn.innerHTML = '📖 해설 열기';
      }
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      let html = '';

      quizData.forEach((q, qIndex) => {
        gradingState[qIndex] = { subs: [], earnedScore: 0, isGraded: false };
        
        html += `<div class="question-card clearfix" id="qCard-${qIndex}">`;
        html += `<div class="main-q-title">${q.mainQuestion} <span class="q-score-badge">배점: ${q.score}점</span></div>`;
        
        q.subs.forEach((sub, sIndex) => {
          gradingState[qIndex].subs[sIndex] = { status: 0 }; 
          
          html += `<div class="sub-q-container">`;
          html += `<div class="sub-q-label">${sub.label}</div>`;
          
          // 문제 이미지 렌더링에 확대 기능(onclick) 적용
          if (sub.image) {
            html += `<div style="margin-bottom: 15px; text-align: center;">
                       <img src="${sub.image}" style="max-width: 100%; border: 1px solid #ddd; border-radius: 5px; cursor: zoom-in;" alt="문제 이미지" onclick="openImageModal(this.src)" title="클릭하여 확대">
                       <div style="font-size:0.85em; color:#7f8c8d; margin-top:5px;">[이미지를 클릭하면 확대됩니다]</div>
                     </div>`;
          }

          if (sub.type === 'calc') {
            html += `<span class="calc-label">▶ 계산 과정 (채점 제외)</span>`;
            html += `<textarea id="calc-${qIndex}-${sIndex}" class="textarea-formula" placeholder="필요시 계산식을 자유롭게 적어보세요."></textarea>`;
            html += `<span class="calc-label">▶ 최종 정답 (채점 대상)</span>`;
            html += `<input type="text" id="ans-${qIndex}-${sIndex}" class="input-calc" autocomplete="off" placeholder="최종 정답 입력">`;
          } else if (sub.type === 'descriptive') {
            html += `<textarea id="ans-${qIndex}-${sIndex}" class="textarea-formula" placeholder="※ 연습장에 직접 풀거나 구조식을 그린 후, [✔️ 정답 확인 및 채점] 버튼을 눌러 스스로 비교해 보세요."></textarea>`;
          } else {
            html += `<input type="text" id="ans-${qIndex}-${sIndex}" class="input-standard" autocomplete="off" placeholder="${sub.type === 'unordered_comma' ? '쉼표(,)로 구분하여 입력' : '정답 입력'}">`;
          }
          
          html += `<div id="fb-${qIndex}-${sIndex}" class="feedback-box"></div>`;
          html += `</div>`;
        });
        
        html += `<div style="text-align: right; margin-top: 15px; margin-bottom: 10px; clear: both;">`;
        html += `  <button id="btn-toggle-exp-${qIndex}" class="btn-grade-single" style="float: none; background-color: #8d6e63; margin-right: 8px; display: none;" onclick="toggleExplanation(${qIndex})">📖 해설 열기</button>`;
        html += `  <button id="btn-grade-single-${qIndex}" class="btn-grade-single" style="float: none;" onclick="gradeSingleQuestion(${qIndex})">✔️ 정답 확인 및 채점</button>`;
        html += `</div>`;
        
        if(q.explanation) {
            html += `<div style="clear:both;"></div>`;
            html += `<div id="exp-${qIndex}" class="feedback-box" style="background-color:#f8f9fa; border:1px solid #dee2e6; color:#495057; font-weight:normal; margin-top:10px; display:none;">💡 <strong>문제 핵심 해설:</strong><br>${q.explanation}</div>`;
        }
        html += `</div>`;
      });
      container.innerHTML = html;
    }

    function setMode(mode) {
      const labelBasic = document.getElementById('label-basic');
      const labelStudy = document.getElementById('label-study');
      
      if (mode === 'study') {
        if(labelStudy.classList.contains('active')) return; 
        
        labelBasic.classList.remove('active');
        labelStudy.classList.add('active');
        
        quizData.forEach((q, qIndex) => {
          const expEl = document.getElementById(`exp-${qIndex}`);
          const toggleBtn = document.getElementById(`btn-toggle-exp-${qIndex}`);
          if (expEl) {
            expEl.style.display = 'block';
            if(toggleBtn) {
              toggleBtn.style.display = 'inline-block'; 
              toggleBtn.innerHTML = '📖 해설 닫기';
            }
          }
        });
        
      } else if (mode === 'basic') {
        if(confirm("기본 모드로 전환하면 현재 입력된 내용이 초기화됩니다. 전환하시겠습니까?")) {
          location.reload();
        }
      }
    }

    function isEquationCorrect(userInput, ansList) {
      let u = userInput.replace(/\s+/g, '').replace(/=/g, '->');
      let uParts = u.split('->');
      if(uParts.length !== 2) return false;
      let uLeft = uParts[0].split('+').sort().join('+');
      let uRight = uParts[1].split('+').sort().join('+');
      
      for(let i=0; i<ansList.length; i++) {
        let a = ansList[i].replace(/\s+/g, '').replace(/=/g, '->');
        let aParts = a.split('->');
        if(aParts.length !== 2) continue;
        let aLeft = aParts[0].split('+').sort().join('+');
        let aRight = aParts[1].split('+').sort().join('+');
        if (uLeft === aLeft && uRight === aRight) return true;
      }
      return false;
    }

    function evaluateSub(qIndex, sIndex) {
      const sub = quizData[qIndex].subs[sIndex];
      const inputEl = document.getElementById(`ans-${qIndex}-${sIndex}`);
      if (inputEl.disabled) return; 

      let userVal = inputEl.value;
      let isCorrect = false;

      if (userVal.trim() === "") {
         isCorrect = false;
      } else if (sub.type === 'short' || sub.type === 'calc') {
        let uClean = userVal.replace(/\s+/g, '').toLowerCase();
        isCorrect = sub.answers.some(a => a.replace(/\s+/g, '').toLowerCase() === uClean);
      } else if (sub.type === 'formula') {
        let uClean = userVal.replace(/\s+/g, '');
        isCorrect = sub.answers.some(a => a.replace(/\s+/g, '') === uClean);
      } else if (sub.type === 'order') {
        let uClean = userVal.replace(/[^0-9]/g, '');
        isCorrect = sub.answers.some(a => a.replace(/[^0-9]/g, '') === uClean);
      } else if (sub.type === 'unordered_comma') {
        let uClean = userVal.replace(/\s+/g, '').toLowerCase();
        isCorrect = sub.answers.some(a => {
            let aClean = a.replace(/\s+/g, '').toLowerCase();
            let uArr = uClean.split(',').filter(Boolean).sort();
            let aArr = aClean.split(',').filter(Boolean).sort();
            return uArr.length === aArr.length && uArr.every((val, index) => val === aArr[index]);
        });
      } else if (sub.type === 'equation') {
        isCorrect = isEquationCorrect(userVal, sub.answers);
      } else if (sub.type === 'descriptive') {
        if (sub.keywords) {
          let hasAllKeys = sub.keywords.every(kw => userVal.includes(kw));
          isCorrect = hasAllKeys;
        } else {
          isCorrect = false; 
        }
      }

      gradingState[qIndex].subs[sIndex].status = isCorrect ? 1 : 0;
      
      inputEl.disabled = true;
      const calcEl = document.getElementById(`calc-${qIndex}-${sIndex}`);
      if (calcEl) calcEl.disabled = true;

      updateFeedbackUI(qIndex, sIndex);
    }

    function updateFeedbackUI(qIndex, sIndex) {
      const q = quizData[qIndex];
      const sub = q.subs[sIndex];
      const state = gradingState[qIndex].subs[sIndex];
      const fbDiv = document.getElementById(`fb-${qIndex}-${sIndex}`);
      
      let html = "";
      if (state.status === 1) {
        fbDiv.className = "feedback-box is-correct";
        html += `✅ 정답입니다!`;
      } else if (state.status === 0.5) {
        fbDiv.className = "feedback-box is-partial";
        html += `⚠ 부분 점수 (0.5개 인정)`;
      } else {
        fbDiv.className = "feedback-box is-incorrect";
        
        if (q.isUnordered || sub.type === 'unordered_comma') {
          let allAnswers = q.subs.map(s => s.answers[0]).join(", ");
          html += `❌ 오답입니다. (모범 답안: ${sub.answers[0]})`;
        } else {
          html += `❌ 오답입니다. (모범 답안: ${sub.answers[0]})`;
        }
      }

      // 정답용 이미지 렌더링에 확대 기능(onclick) 적용
      if (sub.answerImage) {
        html += `<div style="margin-top: 15px; text-align: center;">
                   <img src="${sub.answerImage}" style="max-width: 100%; border: 2px solid #2196f3; border-radius: 5px; cursor: zoom-in;" alt="정답 해설 이미지" onclick="openImageModal(this.src)" title="클릭하여 확대">
                   <div style="font-size:0.85em; color:#1976d2; margin-top:5px;">[정답 참고 이미지 - 클릭 시 확대]</div>
                 </div>`;
      }

      if (sub.type === 'descriptive') {
        html += `<div class="override-btns">
                  <span style="font-size:0.85em; color:#666; font-weight:normal; margin-right:8px;">▶ 서술/그림 자율 채점:</span><br><br>
                  <button class="btn-override btn-correct" onclick="overrideScore(${qIndex}, ${sIndex}, 1)">정답 인정</button>
                  <button class="btn-override btn-partial" onclick="overrideScore(${qIndex}, ${sIndex}, 0.5)">부분 점수</button>
                  <button class="btn-override btn-incorrect" onclick="overrideScore(${qIndex}, ${sIndex}, 0)">오답 처리</button>
                 </div>`;
      }

      fbDiv.innerHTML = html;
      fbDiv.style.display = "block";
    }

    function updateCardScore(qIndex) {
      const q = quizData[qIndex];
      let correctSubs = 0;
      q.subs.forEach((sub, sIndex) => {
        correctSubs += gradingState[qIndex].subs[sIndex].status;
      });
      gradingState[qIndex].earnedScore = (correctSubs / q.subs.length) * q.score;
      
      const cardTitle = document.querySelector(`#qCard-${qIndex} .q-score-badge`);
      if(cardTitle) {
        let qEarnedScore = Math.round(gradingState[qIndex].earnedScore);
        cardTitle.innerHTML = `배점: ${q.score}점 (획득: <strong>${qEarnedScore}점</strong>)`;
        if (qEarnedScore === q.score) cardTitle.style.backgroundColor = "#e8f5e9";
        else if (qEarnedScore > 0) cardTitle.style.backgroundColor = "#fff3e0";
        else cardTitle.style.backgroundColor = "#ffebee";
      }
    }

    function gradeSingleQuestion(qIndex) {
      const q = quizData[qIndex];

      if (q.isUnordered) {
        let answerPool = q.subs.map(sub => {
           return sub.answers.map(a => sub.type === 'formula' ? a.replace(/\s+/g, '') : a.replace(/\s+/g, '').toLowerCase());
        });

        q.subs.forEach((sub, sIndex) => {
          const inputEl = document.getElementById(`ans-${qIndex}-${sIndex}`);
          if (!inputEl || inputEl.disabled) return;

          let userVal = inputEl.value;
          let uClean = sub.type === 'formula' ? userVal.replace(/\s+/g, '') : userVal.replace(/\s+/g, '').toLowerCase();
          let isCorrect = false;

          if (uClean !== "") {
            for (let i = 0; i < answerPool.length; i++) {
              if (answerPool[i].includes(uClean)) {
                isCorrect = true;
                answerPool.splice(i, 1);
                break;
              }
            }
          }

          gradingState[qIndex].subs[sIndex].status = isCorrect ? 1 : 0;
          inputEl.disabled = true;
          updateFeedbackUI(qIndex, sIndex);
        });
      } else {
        const poolUsed = {};
        const normPool = v => v.replace(/\s+/g, '').toLowerCase();
        q.subs.forEach((sub, sIndex) => {
          if (sub.type === 'pool') {
            const inputEl = document.getElementById(`ans-${qIndex}-${sIndex}`);
            if (!inputEl || inputEl.disabled) return;
            const u = normPool(inputEl.value);
            const used = poolUsed[sub.poolId] = poolUsed[sub.poolId] || [];
            let ok = false;
            if (u !== '' && sub.answers.some(a => normPool(a) === u) && !used.includes(u)) { ok = true; used.push(u); }
            gradingState[qIndex].subs[sIndex].status = ok ? 1 : 0;
            inputEl.disabled = true;
            updateFeedbackUI(qIndex, sIndex);
          } else {
            evaluateSub(qIndex, sIndex);
          }
        });
      }

      updateCardScore(qIndex);
      gradingState[qIndex].isGraded = true;

      const expEl = document.getElementById(`exp-${qIndex}`);
      const toggleBtn = document.getElementById(`btn-toggle-exp-${qIndex}`);
      if (expEl) {
          expEl.style.display = 'block';
          if(toggleBtn) {
            toggleBtn.style.display = 'inline-block';
            toggleBtn.innerHTML = '📖 해설 닫기';
          }
      }
      
      const btnEl = document.getElementById(`btn-grade-single-${qIndex}`);
      if (btnEl) btnEl.style.display = 'none';
      
      if (isTestSubmitted) calculateFinalTotal();
    }

    function gradeAll() {
      isTestSubmitted = true;
      quizData.forEach((q, qIndex) => {
        if (!gradingState[qIndex].isGraded) {
          gradeSingleQuestion(qIndex);
        }
      });
      document.getElementById('submit-btn').style.display = 'none';
      calculateFinalTotal();
    }

    function overrideScore(qIndex, sIndex, newStatus) {
      gradingState[qIndex].subs[sIndex].status = newStatus;
      updateFeedbackUI(qIndex, sIndex);
      updateCardScore(qIndex);
      if (isTestSubmitted) calculateFinalTotal(); 
    }

    function calculateFinalTotal() {
      let totalEarned = 0;
      let totalMax = 0;

      quizData.forEach((q, qIndex) => {
        totalMax += q.score;
        totalEarned += gradingState[qIndex].earnedScore;
      });

      const resDiv = document.getElementById('final-result');
      resDiv.style.display = "block";
      
      totalEarned = Math.round(totalEarned * 10) / 10;
      let percent = Math.round((totalEarned / totalMax) * 100);
      let passMsg = percent >= 60 
        ? `<div style="color:#2e7d32; margin-top:10px;">🎉 합격을 축하합니다! 완벽에 가까워지고 있습니다.</div>`
        : `<div style="color:#c62828; margin-top:10px;">😢 불합격입니다. 부족한 부분의 해설을 꼭 복습하세요!</div>`;

      resDiv.innerHTML = `총 획득 점수: <strong>${totalEarned}점</strong> / ${totalMax}점 만점 <br> ${passMsg}`;
    }

    renderQuiz();

    // ================== 우측 문항 내비게이션 모듈 시작 ==================
    function initNavPanel() {
      const navHtml = `
        <div id="q-nav-panel">
          <div class="q-nav-header">📌 문항 이동</div>
          <div class="q-nav-grid" id="q-nav-grid"></div>
          <div class="q-nav-legend">
            <div><span class="box" style="background:#fff; border:1px solid #dee2e6;"></span>미작성</div>
            <div><span class="box" style="background:#e3f2fd; border:1px solid #90caf9;"></span>답안 입력됨</div>
            <div><span class="box" style="background:#e8f5e9; border:1px solid #81c784;"></span>정답 / 채점완료</div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', navHtml);

      const navGrid = document.getElementById('q-nav-grid');
      let gridHtml = '';
      quizData.forEach((q, qIndex) => {
        gridHtml += `<button class="q-nav-btn" id="nav-btn-${qIndex}" onclick="scrollToQuestion(${qIndex})">${qIndex + 1}</button>`;
      });
      navGrid.innerHTML = gridHtml;

      document.getElementById('quiz-container').addEventListener('input', updateNavStatus);

      if (typeof gradeSingleQuestion === 'function') {
        const originalGradeSingle = gradeSingleQuestion;
        gradeSingleQuestion = function(qIndex) {
          originalGradeSingle(qIndex);
          updateNavStatus();
        };
      }

      if (typeof overrideScore === 'function') {
        const originalOverrideScore = overrideScore;
        overrideScore = function(qIndex, sIndex, newStatus) {
          originalOverrideScore(qIndex, sIndex, newStatus);
          updateNavStatus();
        };
      }

      if (typeof gradeAll === 'function') {
        const originalGradeAll = gradeAll;
        gradeAll = function() {
          originalGradeAll();
          updateNavStatus();
        };
      }

      updateNavStatus();
    }

    function scrollToQuestion(qIndex) {
      const target = document.getElementById(`qCard-${qIndex}`);
      if(target) {
        const topPos = target.getBoundingClientRect().top + window.pageYOffset - 20;
        window.scrollTo({ top: topPos, behavior: 'smooth' });
      }
    }

    function updateNavStatus() {
      quizData.forEach((q, qIndex) => {
        const navBtn = document.getElementById(`nav-btn-${qIndex}`);
        if(!navBtn) return;

        if (gradingState[qIndex] && gradingState[qIndex].isGraded) {
          let qEarnedScore = Math.round(gradingState[qIndex].earnedScore);
          navBtn.className = 'q-nav-btn'; 
          if (qEarnedScore === q.score) navBtn.classList.add('correct');
          else if (qEarnedScore > 0) navBtn.classList.add('partial');
          else navBtn.classList.add('incorrect');
          return;
        }

        let hasAnswer = false;
        q.subs.forEach((sub, sIndex) => {
          const inputEl = document.getElementById(`ans-${qIndex}-${sIndex}`);
          const calcEl = document.getElementById(`calc-${qIndex}-${sIndex}`);
          if (inputEl && inputEl.value.trim() !== '') hasAnswer = true;
          if (calcEl && calcEl.value.trim() !== '') hasAnswer = true;
        });

        if (hasAnswer) {
          navBtn.classList.add('answered'); 
        } else {
          navBtn.classList.remove('answered'); 
        }
      });
    }

    setTimeout(initNavPanel, 100);
  </script>

  <script>
    // ================== 이미지 확대/축소 및 Pan(드래그) 모달 제어 스크립트 ==================
    let currentZoom = 1;
    let isDragging = false;
    let startX = 0, startY = 0;
    let translateX = 0, translateY = 0;

    function openImageModal(src) {
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-img');
      
      modalImg.src = src;
      currentZoom = 1;
      translateX = 0;
      translateY = 0;
      updateImageTransform();
      
      modal.style.display = 'flex';
    }

    function closeImageModal() {
      const modal = document.getElementById('image-modal');
      modal.style.display = 'none';
    }

    function zoomImage(step) {
      currentZoom += step;
      if (currentZoom < 0.5) currentZoom = 0.5;
      if (currentZoom > 5) currentZoom = 5; 
      updateImageTransform();
    }

    function resetZoom() {
      currentZoom = 1;
      translateX = 0;
      translateY = 0;
      updateImageTransform();
    }

    function updateImageTransform() {
      const modalImg = document.getElementById('modal-img');
      modalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentZoom})`;
    }

    // --- 드래그(Pan) 이벤트 ---
    const modalImg = document.getElementById('modal-img');

    // 마우스 이벤트 (PC 환경)
    modalImg.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
      modalImg.style.cursor = 'grabbing';
      modalImg.style.transition = 'none'; 
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateImageTransform();
    });

    document.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        modalImg.style.cursor = 'grab';
        modalImg.style.transition = 'transform 0.05s linear'; 
      }
    });

    // 터치 이벤트 (모바일/태블릿 환경)
    modalImg.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - translateX;
        startY = e.touches[0].clientY - translateY;
        modalImg.style.transition = 'none';
      }
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      e.preventDefault(); 
      translateX = e.touches[0].clientX - startX;
      translateY = e.touches[0].clientY - startY;
      updateImageTransform();
    }, { passive: false });

    document.addEventListener('touchend', () => {
      if (isDragging) {
        isDragging = false;
        modalImg.style.transition = 'transform 0.05s linear';
      }
    });

    // 마우스 휠 확대/축소 지원
    modalImg.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY < 0) {
        zoomImage(0.1);
      } else {
        zoomImage(-0.1);
      }
    }, { passive: false });

        // ================== 전체화면 필기 모드 (MEMO) 스크립트 ==================
    let memoCanvas, memoCtx;
    let isMemoDrawing = false;
    let memoCurrentTool = 'pen';
    let isMemoMode = false;
    let memoCurrentColor = '#333333'; // 기본 검정
    let memoPenWidth = 3;
    let memoEraserWidth = 30;

    function toggleMemoMode() {
      isMemoMode = !isMemoMode;
      const btn = document.getElementById('memo-toggle-btn');
      
      if (isMemoMode) {
        document.body.classList.add('drawing-mode');
        btn.innerHTML = "필기 끄기";
        btn.classList.add('active');
        if (!memoCanvas) initMemoCanvas();
        else updateCanvasSize(); // 필기 모드를 켤 때마다 문서 크기에 맞게 캔버스 크기 조정
      } else {
        document.body.classList.remove('drawing-mode');
        btn.innerHTML = "필기 켜기";
        btn.classList.remove('active');
      }
    }

    function updateCanvasSize() {
      if (!memoCanvas) return;
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = memoCanvas.width;
      tempCanvas.height = memoCanvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(memoCanvas, 0, 0);

      // 문서 전체의 스크롤 높이/너비로 캔버스 크기 설정
      memoCanvas.width = Math.max(document.documentElement.scrollWidth, window.innerWidth);
      memoCanvas.height = Math.max(document.documentElement.scrollHeight, window.innerHeight);

      memoCtx.drawImage(tempCanvas, 0, 0);
    }

    function initMemoCanvas() {
      memoCanvas = document.getElementById('overlay-canvas');
      memoCtx = memoCanvas.getContext('2d');
      
      updateCanvasSize();
      window.addEventListener('resize', updateCanvasSize);
      
      memoCanvas.addEventListener('mousedown', startMemoDraw);
      memoCanvas.addEventListener('mousemove', drawMemo);
      memoCanvas.addEventListener('mouseup', stopMemoDraw);
      memoCanvas.addEventListener('mouseout', stopMemoDraw);
      memoCanvas.addEventListener('touchstart', startMemoDraw, { passive: false });
      memoCanvas.addEventListener('touchmove', drawMemo, { passive: false });
      memoCanvas.addEventListener('touchend', stopMemoDraw);
      
      document.getElementById('memo-width-slider').value = memoPenWidth;
    }

    function getMemoCoordinates(e) {
      const rect = memoCanvas.getBoundingClientRect();
      if (e.touches && e.touches.length > 0) {
        return { 
          x: e.touches[0].clientX - rect.left, 
          y: e.touches[0].clientY - rect.top 
        };
      }
      return { 
        x: e.clientX - rect.left, 
        y: e.clientY - rect.top 
      };
    }

    function startMemoDraw(e) {
      if (!isMemoMode) return;
      if (e.target.closest('#memo-wrapper') || e.target.closest('#q-nav-panel')) return;
      
      e.preventDefault(); 
      isMemoDrawing = true;
      const pos = getMemoCoordinates(e);
      memoCtx.beginPath();
      memoCtx.moveTo(pos.x, pos.y);
    }

    function drawMemo(e) {
      if (!isMemoDrawing || !isMemoMode) return;
      e.preventDefault(); 
      const pos = getMemoCoordinates(e);
      memoCtx.lineTo(pos.x, pos.y);
      
      if (memoCurrentTool === 'eraser') {
        memoCtx.globalCompositeOperation = 'destination-out';
        memoCtx.lineWidth = memoEraserWidth;       
      } else {
        memoCtx.globalCompositeOperation = 'source-over';
        memoCtx.strokeStyle = memoCurrentColor;
        memoCtx.lineWidth = memoPenWidth;        
      }
      memoCtx.lineCap = 'round';
      memoCtx.lineJoin = 'round';
      memoCtx.stroke();
    }

    function stopMemoDraw() {
      if (!isMemoDrawing) return;
      isMemoDrawing = false;
      memoCtx.closePath();
    }

    function setMemoTool(tool) {
      memoCurrentTool = tool;
      document.getElementById('memo-pen').classList.remove('active');
      document.getElementById('memo-eraser').classList.remove('active');
      document.getElementById('memo-' + tool).classList.add('active');
      
      const slider = document.getElementById('memo-width-slider');
      if (tool === 'eraser') {
        slider.value = memoEraserWidth;
      } else {
        slider.value = memoPenWidth;
      }
    }

    function setMemoColor(color, btnElement) {
      memoCurrentColor = color;
      setMemoTool('pen'); 
      
      const colorBtns = document.querySelectorAll('.color-btn');
      colorBtns.forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }

    function updateMemoWidth(val) {
      if (memoCurrentTool === 'eraser') {
        memoEraserWidth = parseInt(val);
      } else {
        memoPenWidth = parseInt(val);
      }
    }

    function clearMemoCanvas() {
      if(memoCtx) memoCtx.clearRect(0, 0, memoCanvas.width, memoCanvas.height);
    }
  </script>
</body>
</html>
